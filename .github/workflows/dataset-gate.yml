name: Dataset gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  releaseguard:
    name: ReleaseGuard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dataset
        uses: KageRyo/ReleaseGuard@7aef82c50aa0e4ee7b79527a279059ff45bbfc05 # v0.2.3
        with:
          path: .

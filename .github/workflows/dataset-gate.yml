name: Dataset gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  releaseguard:
    name: ReleaseGuard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dataset
        uses: KageRyo/ReleaseGuard@c0daf596d170dc7cdff545f9975c9b99a57aecbc # v0.2.1
        with:
          path: .

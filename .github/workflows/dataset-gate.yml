name: Dataset gate

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "release.yaml"
      - ".github/workflows/dataset-gate.yml"

  push:
    branches:
      - main
    paths:
      - "data/**"
      - "schema/**"
      - "release.yaml"
      - ".github/workflows/dataset-gate.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  releaseguard:
    name: ReleaseGuard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate dataset
        uses: KageRyo/ReleaseGuard@v0.2.0
        with:
          path: .

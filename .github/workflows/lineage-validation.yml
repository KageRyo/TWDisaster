name: LineageGuard

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineageguard:
    name: LineageGuard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate provenance and verify local artifact hashes
        uses: KageRyo/LineageGuard@e48f12825fdfbcab8c3d0345fd3de8149b2423c3 # v0.3.0
        with:
          path: .
